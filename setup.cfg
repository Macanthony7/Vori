# Tool settings only (this isn't a package). Coverage of the backend: docs/testing.md#coverage.
# The E2E server runs inside the test process, so browser tests count too. run_tests.py runs each
# suite in its own process (parallel = true) and combines them.
[coverage:run]
source = backend
omit =
    backend/test_*.py
parallel = true

[coverage:report]
show_missing = true
precision = 0
exclude_lines =
    pragma: no cover
    if __name__ == .__main__.:
